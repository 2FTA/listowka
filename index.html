<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍻 Pivo.od.ua — магазини пива</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f9f5ee;
            color: #2e241e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        .card {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            padding: 30px 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            border: 1px solid #efe6da;
        }

        /* ===== Главное: убираем все отступы у хедера ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
            line-height: 0;  /* убивает лишние вертикальные отступы */
        }

        /* ===== Логотип: большой и центрированный ===== */
        .header img {
            max-height: 50vh;      /* 50% высоты окна — меняйте под себя */
            width: auto;
            max-width: 90%;
            display: block;
            margin: 0 auto;        /* убираем margin:20px, который давал отступы */
        }

        /* ===== Подзаголовок ===== */
        .subtitle {
            font-size: 1.1rem;
            color: #7a6a5c;
            border-left: 4px solid #d4a373;
            padding: 10px 16px;
            background: #fcf8f3;
            border-radius: 0 12px 12px 0;
            margin: 10px 0 20px 0;  /* сверху 10px, снизу 20px */
            line-height: 1.4;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .shop-item {
            background: #fcf9f5;
            border-radius: 16px;
            border: 1px solid #ece3d8;
        }

        .shop-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #2e241e;
            font-size: 1rem;
            font-weight: 500;
            padding: 14px 16px;
            border-radius: 16px;
            transition: 0.15s ease;
        }

        .shop-item a .icon {
            font-size: 1.6rem;
            width: 34px;
            text-align: center;
            flex-shrink: 0;
        }

        .shop-item a .address {
            flex: 1;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .shop-item a .arrow {
            color: #b5927a;
            font-size: 1.2rem;
            flex-shrink: 0;
            transition: 0.15s;
        }

        .shop-item:hover {
            background: #fffcf8;
            border-color: #d4a373;
        }
        .shop-item:hover a .arrow {
            color: #8b5e3c;
            transform: translateX(4px);
        }
        .shop-item:active {
            background: #f3ede7;
            transform: scale(0.98);
        }

        .footer {
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid #e9ddd0;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.9rem;
            color: #7a6a5c;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .card {
                padding: 20px 16px;
            }
            .shop-grid {
                grid-template-columns: 1fr;
            }
            .header img {
                max-height: 30vh;   /* на телефонах поменьше */
            }
            .subtitle {
                font-size: 1rem;
                margin: 8px 0 16px 0;
            }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <img src="Logo.svg" alt="Одеська приватна пивоварня">
    </div>
    <div class="subtitle">
        🌾 Оберіть зручний магазин
    </div>
    <div class="shop-grid">
        <!-- Список ваших магазинов (вставьте свои) -->
        <div class="shop-item">
            <a href="https://www.google.com/maps/search/вул.+Академіка+Сахарова,+36" target="_blank">
                <span class="icon">🏪</span>
                <span class="address">вул. Академіка Сахарова, 36</span>
                <span class="arrow">→</span>
            </a>
        </div>
        <div class="shop-item">
            <a href="https://www.google.com/maps/search/Десантний+бульвар,+3" target="_blank">
                <span class="icon">🏪</span>
                <span class="address">Десантний бульвар, 3</span>
                <span class="arrow">→</span>
            </a>
        </div>
        <div class="shop-item">
            <a href="https://www.google.com/maps/search/пр-т+Володимира+Великого,+39а" target="_blank">
                <span class="icon">🏪</span>
                <span class="address">пр-т Володимира Великого, 39а</span>
                <span class="arrow">→</span>
            </a>
        </div>
        <!-- добавьте остальные 11 магазинов по такому же принципу -->
    </div>
    <div class="footer">
        <span>📞 +38 (048) 777-77-77</span>
        <span class="hours">🕒 Пн–Нд: 10:00 – 22:00</span>
    </div>
</div>
</body>
</html>
